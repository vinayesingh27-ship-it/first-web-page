<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeLab</title>
</head>
<body>

    <!-- Header / Navbar -->
    <header>
        <div class="logo">CodeLab</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Courses</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
        <button type="button">Sign up</button>
    </header>

    <!-- Hero Section -->
    <main>
        <section class="hero">
            <h1>Learn Web Development</h1>
            <p>Start from zero. Build real projects.</p>
            <button type="button">Get started</button>
        </section>

        <!-- Course Cards Section -->
        <section class="courses">
            <article class="card">
                <h2>HTML</h2>
                <p>Build the structure</p>
            </article>

            <article class="card">
                <h2>CSS</h2>
                <p>Make it beautiful</p>
            </article>

            <article class="card">
                <h2>JavaScript</h2>
                <p>Make it smart</p>
            </article>

            <article class="card">
                <h2>Git</h2>
                <p>Save your work</p>
            </article>
        </section>
    </main>

</body>
</html>
